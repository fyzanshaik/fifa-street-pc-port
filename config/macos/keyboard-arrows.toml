# restreet-keyboard-profile: source of truth for the macOS MnK keybinds; reapply
# to an existing config with scripts/apply-macos-keyboard-profile.sh.
# FIFA Street macOS keyboard profile. No modifier keys are used, so movement
# continues while holding sprint or street-ball control. Xbox prompts remain.
keybind_lstick_up = "Up"
keybind_lstick_down = "Down"
keybind_lstick_left = "Left"
keybind_lstick_right = "Right"
keybind_lstick_press = "Z"
keybind_a = "Space"
keybind_b = "D,Backspace"
keybind_x = "A"
keybind_y = "S"
keybind_left_trigger = "Q"
keybind_right_trigger = "E"
keybind_left_shoulder = "W"
keybind_right_shoulder = "R"
keybind_rstick_up = "I"
keybind_rstick_down = "K"
keybind_rstick_left = "J"
keybind_rstick_right = "L"
keybind_rstick_press = "C"
keybind_dpad_up = "T"
keybind_dpad_down = "G"
keybind_dpad_left = "F"
keybind_dpad_right = "H"
keybind_back = "Tab"
keybind_start = "Return"
keybind_guide = ""
